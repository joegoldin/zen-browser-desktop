# Temporary: verifies the erdtree self-hosted runner. Delete after one run.
name: Runner smoke test
on: workflow_dispatch
jobs:
  smoke:
    runs-on: [self-hosted, erdtree]
    steps:
      - name: Show environment and cgroup caps
        run: |
          head -2 /etc/os-release
          nproc
          echo "cpu.max:    $(cat /sys/fs/cgroup/cpu.max)"
          echo "memory.max: $(cat /sys/fs/cgroup/memory.max)"
          touch /opt/sccache/.smoke && ls -la /opt/sccache
