# Builds the fork's x86_64 Linux release: a tarball, published as a GitHub
# release, from which the package job then cuts a deb and an rpm. That tarball
# is also what the AUR package and the Nix repack path source.
#
# It is deliberately not cut from the Nix build, which hard-codes /nix/store
# into the ELF interpreter and RPATH and so cannot be repackaged for a machine
# without a Nix store.
#
# x86_64 only, and PGO off via ZEN_GA_DISABLE_PGO: the two-stage profile-
# generation build runs under Xvfb and roughly doubles a build that already
# takes hours. The build job runs on the erdtree self-hosted runner (an
# ephemeral Ubuntu container capped at 18 CPUs / 64 GiB); the package job
# stays on stock ubuntu-latest.
#
# One secret: RELEASE_TOKEN, a fine-grained PAT scoped to this repository with
# contents read/write, used only to publish the release (see that step for
# why the workflow token cannot). Upstream's equivalent additionally passes
# API keys for safebrowsing, location and Mozilla services, each guarded by a
# presence check in release-build.sh, so the build succeeds without them and
# the browser simply ships with none embedded.
name: Fork Linux release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork version, e.g. 1.21.9b-tst.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, erdtree]
    env:
      # Compilation cache on the runner's persistent local volume — unlike the
      # GHA-backed cache this one isn't capped at 10 GB, so a full Firefox
      # object cache survives between builds. clear-all-cache.yml still covers
      # the Actions cache other workflows use; to clear THIS cache, wipe the
      # gha-zen-sccache docker volume on erdtree.
      SCCACHE_DIR: /opt/sccache
      SCCACHE_CACHE_SIZE: 50G
      CARGO_INCREMENTAL: 0
    steps:
      # First, before anything expensive. The version is baked into the binary
      # by the surfer step and becomes a public tag four hours later, so a bad
      # one has to fail here rather than at packaging time.
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9][^-]*-tst\.[0-9]+$'; then
            echo "VERSION must look like 1.21.9b-tst.1, got: $VERSION" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip dos2unix yasm nasm build-essential \
            libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev \
            libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev \
            libx11-xcb-dev libxt-dev xvfb lld llvm

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main
        with:
          disable_annotations: true

      # surfer initialises a git repo inside engine/ on a zen_browser branch and
      # commits the pristine source into it before patching. Without an identity
      # that commit never happens, and mach bootstrap then dies running
      # `git log -1` against a branch with no commits.
      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install npm dependencies
        run: npm ci

      - name: Surfer CI setup
        run: npm run surfer -- ci --brand release --display-version ${{ inputs.version }}

      - name: Download Firefox source
        run: |
          # surfer's unpackFirefoxSource calls an async ensureDirectory for
          # engine/ without awaiting it, so its tar -C engine races the mkdir.
          # GitHub's runners win that race; the erdtree container's overlayfs
          # loses it and tar dies on "Cannot open: No such file or directory".
          mkdir -p engine
          npm run download

      - name: Pin Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain $(cat .rust-toolchain)
          . "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-gnu

      - name: Import the Zen patchset
        env:
          SURFER_COMPAT: x86_64
        run: |
          . "$HOME/.cargo/env"
          npm run import

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Bootstrap
        run: |
          cd engine
          export SURFER_PLATFORM="linux"
          ./mach --no-interactive bootstrap --application-choice browser
          cd ..

      - name: Build
        env:
          SURFER_COMPAT: x86_64
          ZEN_RELEASE_BRANCH: release
          ZEN_GA_DISABLE_PGO: 1
        run: |
          export SURFER_PLATFORM="linux"
          bash .github/workflows/src/release-build.sh

      - name: Package
        env:
          SURFER_COMPAT: x86_64
          ZEN_GA_DISABLE_PGO: true
        run: |
          export SURFER_PLATFORM="linux"
          export ZEN_RELEASE=1
          npm run package

      - name: Rename artifact
        run: mv dist/zen-*.tar.xz "zen.linux-x86_64.tar.xz"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: zen.linux-x86_64.tar.xz
          path: ./zen.linux-x86_64.tar.xz
          retention-days: 7

      - name: Publish release
        env:
          # GITHUB_TOKEN cannot create releases here: it is granted
          # contents:write (visible in Set up job) and still gets HTTP 403
          # "Resource not accessible by integration" from POST /releases.
          # RELEASE_TOKEN is a fine-grained PAT with contents read/write on
          # this repository alone. Upstream's release steps run on a PAT too.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # --target pins the tag to the commit that was actually built.
          # Without it the tag lands on the default branch's head, so a
          # dispatch from any other ref ships a binary that does not match the
          # source the tag names, which is what the AUR package builds from.
          #
          # If the release already exists (a re-run, or it was published by
          # hand from this run's artifact), replace its tarball rather than
          # failing on the duplicate tag.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" --clobber ./zen.linux-x86_64.tar.xz
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Zen with native tree-style tabs. Unofficial fork of zen-browser/desktop." \
              ./zen.linux-x86_64.tar.xz
          fi

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: zen.linux-x86_64.tar.xz

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Lay out the tree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p root/opt/zen-tst root/usr/bin root/usr/share/applications
          tar -xJf zen.linux-x86_64.tar.xz -C root/opt/zen-tst --strip-components=1
          ln -s /opt/zen-tst/zen root/usr/bin/zen
          cp packaging/zen.desktop root/usr/share/applications/zen.desktop

      - name: Build deb and rpm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Both halves of the split below are meaningless unless VERSION has
          # the documented shape. Without this check a bare "1.21.9b" splits
          # into version=1.21.9b iteration=1.21.9b and builds happily.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9][^-]*-tst\.[0-9]+$'; then
            echo "VERSION must look like 1.21.9b-tst.1, got: $VERSION" >&2
            exit 1
          fi
          # rpm treats a dash as the version/release separator and rewrites any
          # it finds, so the -tst.N suffix becomes the release field there. deb
          # has no such restriction and keeps the version string whole.
          rpm_version="${VERSION%%-*}"
          rpm_iteration="${VERSION#*-}"
          for target in deb rpm; do
            if [ "$target" = "rpm" ]; then
              ver="$rpm_version"; iter="$rpm_iteration"
            else
              ver="$VERSION"; iter="1"
            fi
            # The dependency list is what the 1.21.9b-tst.1 tarball measurably
            # needed on a bare debian:12: install the deb, add exactly these
            # five, and zen --version runs. Everything else ldd reports missing
            # is Zen's own bundled libraries, resolved through the binary's
            # runpath. The deb names carry | alternatives because Debian's
            # time_t transition renamed the gtk and alsa packages on newer
            # releases.
            if [ "$target" = "rpm" ]; then
              deps=(--depends gtk3 --depends alsa-lib --depends dbus-glib
                    --depends libX11-xcb --depends libXtst)
            else
              deps=(--depends "libgtk-3-0 | libgtk-3-0t64"
                    --depends "libasound2 | libasound2t64"
                    --depends libdbus-glib-1-2
                    --depends libx11-xcb1
                    --depends libxtst6)
            fi
            fpm -s dir -t "$target" \
              "${deps[@]}" \
              -n zen-browser-tst \
              -v "$ver" \
              --iteration "$iter" \
              --description "Zen Browser with native tree-style tabs (unofficial fork)" \
              --url "https://github.com/joegoldin/zen-browser-desktop" \
              --license MPL-2.0 \
              --conflicts zen-browser \
              --provides zen-browser \
              -C root .
          done

      - name: Attach to release
        env:
          # Same restriction as Publish release: uploading assets needs the
          # PAT, not the workflow token.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "$VERSION" --clobber ./*.deb ./*.rpm

  # Rolls the just-published tarball into the AUR package: bumps pkgver,
  # refreshes the checksums against the real asset, regenerates .SRCINFO with
  # real makepkg, pushes to aur.archlinux.org, and commits the refreshed
  # PKGBUILD back to dev so the repo copy never goes stale. Runs in an Arch
  # container because .SRCINFO comes from makepkg and nothing else generates
  # it faithfully. Skipped when the AUR key is not configured.
  aur:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # A step rather than a job-level if: the secrets context does not exist
      # in job-level conditions, where the comparison would quietly evaluate
      # to empty and skip this job forever.
      - name: Check for the AUR key
        id: key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$AUR_SSH_KEY" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "AUR_SSH_KEY not configured; skipping the AUR publish"
          fi

      - name: Install tools
        if: steps.key.outputs.present == 'yes'
        run: pacman -Sy --noconfirm --needed git openssh pacman-contrib

      - name: Checkout
        if: steps.key.outputs.present == 'yes'
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update PKGBUILD for this release
        if: steps.key.outputs.present == 'yes'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The container runs as root; makepkg refuses root on principle.
          useradd -m builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd packaging/aur
          # Arch forbids a dash in pkgver, so the tag's -tst.N becomes _tst.N.
          sed -i "s/^pkgver=.*/pkgver=${VERSION//-/_}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown -R builder .
          # updpkgsums downloads the sources and rewrites every checksum, so
          # the tarball digest and zen.desktop stay correct together.
          # runuser keeps the caller's environment, including HOME, which in a
          # container job is root's /github/home; give makepkg the builder's
          # own writable home instead.
          runuser -u builder -- env HOME=/home/builder updpkgsums
          runuser -u builder -- env HOME=/home/builder sh -c 'makepkg --printsrcinfo > .SRCINFO'
          grep -E "pkgver|sha256" .SRCINFO | head -4

      - name: Push to the AUR
        if: steps.key.outputs.present == 'yes'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Absolute paths throughout: the step shell is POSIX sh, which does
          # not tilde-expand after an =, so a literal ~ reaches ssh — and ssh
          # expands it from the passwd entry (/root), not from the HOME this
          # container job actually runs with (/github/home). The two disagree,
          # ssh reads a known_hosts that was never written, and host key
          # verification fails.
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_KEY" > "$HOME/.ssh/aur" && chmod 600 "$HOME/.ssh/aur"
          # Pinned rather than keyscanned at run time: this is the AUR's
          # published ed25519 host key, and a CI job is exactly where
          # trust-on-first-use is worthless.
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # Cloning a package that does not exist yet yields an empty repo;
          # the first push is what creates it.
          git clone "ssh://aur@aur.archlinux.org/zen-browser-tst-bin.git" /tmp/aur
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO packaging/aur/zen.desktop /tmp/aur/
          cd /tmp/aur
          git config user.name "joegoldin"
          git config user.email "joe@joegold.in"
          git add PKGBUILD .SRCINFO zen.desktop
          if git diff --cached --quiet; then
            echo "AUR already at $VERSION, nothing to push"
          else
            git commit -m "Update to $VERSION"
            git push origin HEAD:master
          fi

      - name: Commit the refreshed PKGBUILD back to dev
        if: steps.key.outputs.present == 'yes'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/aur/PKGBUILD
          if git diff --cached --quiet; then
            echo "PKGBUILD already current"
            exit 0
          fi
          git commit -m "packaging: AUR at $VERSION"
          # Rebase in case dev moved while the build ran; the only local
          # commit is this one.
          git pull --rebase origin dev
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:dev
