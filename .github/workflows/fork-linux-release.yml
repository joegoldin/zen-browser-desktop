# Builds the fork's x86_64 Linux release: a tarball, published as a GitHub
# release, from which the package job then cuts a deb and an rpm. That tarball
# is also what the AUR package and the Nix repack path source.
#
# It is deliberately not cut from the Nix build, which hard-codes /nix/store
# into the ELF interpreter and RPATH and so cannot be repackaged for a machine
# without a Nix store.
#
# x86_64 only, and PGO off via ZEN_GA_DISABLE_PGO: the two-stage profile-
# generation build runs under Xvfb and roughly doubles a build that already
# takes hours. The runner is stock ubuntu-latest, so the 6 h job limit and the
# runner's disk are both real constraints here.
#
# No secrets beyond the automatic GITHUB_TOKEN. Upstream's equivalent passes
# API keys for safebrowsing, location and Mozilla services, each guarded by a
# presence check in release-build.sh, so the build succeeds without them and
# the browser simply ships with none embedded.
name: Fork Linux release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork version, e.g. 1.21.9b-tst.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Compilation cache, backed by the Actions cache. A cold build is around
      # four hours, so the runs that benefit are the ones that follow a failure
      # or a small patch fix. The repository cache is capped at 10 GB and a
      # Firefox object cache will reach it, so expect eviction to blunt this on
      # builds weeks apart; clear-all-cache.yml is there for when it goes stale.
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
    steps:
      # First, before anything expensive. The version is baked into the binary
      # by the surfer step and becomes a public tag four hours later, so a bad
      # one has to fail here rather than at packaging time.
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9][^-]*-tst\.[0-9]+$'; then
            echo "VERSION must look like 1.21.9b-tst.1, got: $VERSION" >&2
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip dos2unix yasm nasm build-essential \
            libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev \
            libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev \
            libx11-xcb-dev libxt-dev xvfb lld llvm

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main
        with:
          disable_annotations: true

      # sccache reaches the Actions cache through these two, which are otherwise
      # only visible to actions rather than to plain run: steps.
      - name: Expose actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      # surfer initialises a git repo inside engine/ on a zen_browser branch and
      # commits the pristine source into it before patching. Without an identity
      # that commit never happens, and mach bootstrap then dies running
      # `git log -1` against a branch with no commits.
      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install npm dependencies
        run: npm ci

      - name: Surfer CI setup
        run: npm run surfer -- ci --brand release --display-version ${{ inputs.version }}

      - name: Download Firefox source
        run: npm run download

      - name: Pin Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain $(cat .rust-toolchain)
          . "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-gnu

      - name: Import the Zen patchset
        env:
          SURFER_COMPAT: x86_64
        run: |
          . "$HOME/.cargo/env"
          npm run import

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Bootstrap
        run: |
          cd engine
          export SURFER_PLATFORM="linux"
          ./mach --no-interactive bootstrap --application-choice browser
          cd ..

      - name: Build
        env:
          SURFER_COMPAT: x86_64
          ZEN_RELEASE_BRANCH: release
          ZEN_GA_DISABLE_PGO: 1
        run: |
          export SURFER_PLATFORM="linux"
          bash .github/workflows/src/release-build.sh

      - name: Package
        env:
          SURFER_COMPAT: x86_64
          ZEN_GA_DISABLE_PGO: true
        run: |
          export SURFER_PLATFORM="linux"
          export ZEN_RELEASE=1
          npm run package

      - name: Rename artifact
        run: mv dist/zen-*.tar.xz "zen.linux-x86_64.tar.xz"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: zen.linux-x86_64.tar.xz
          path: ./zen.linux-x86_64.tar.xz
          retention-days: 7

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # --target pins the tag to the commit that was actually built.
          # Without it the tag lands on the default branch's head, so a
          # dispatch from any other ref ships a binary that does not match the
          # source the tag names, which is what the AUR package builds from.
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Zen with native tree-style tabs. Unofficial fork of zen-browser/desktop." \
            ./zen.linux-x86_64.tar.xz

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: zen.linux-x86_64.tar.xz

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Lay out the tree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p root/opt/zen-tst root/usr/bin root/usr/share/applications
          tar -xJf zen.linux-x86_64.tar.xz -C root/opt/zen-tst --strip-components=1
          ln -s /opt/zen-tst/zen root/usr/bin/zen
          cp packaging/zen.desktop root/usr/share/applications/zen.desktop

      - name: Build deb and rpm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Both halves of the split below are meaningless unless VERSION has
          # the documented shape. Without this check a bare "1.21.9b" splits
          # into version=1.21.9b iteration=1.21.9b and builds happily.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9][^-]*-tst\.[0-9]+$'; then
            echo "VERSION must look like 1.21.9b-tst.1, got: $VERSION" >&2
            exit 1
          fi
          # rpm treats a dash as the version/release separator and rewrites any
          # it finds, so the -tst.N suffix becomes the release field there. deb
          # has no such restriction and keeps the version string whole.
          rpm_version="${VERSION%%-*}"
          rpm_iteration="${VERSION#*-}"
          for target in deb rpm; do
            if [ "$target" = "rpm" ]; then
              ver="$rpm_version"; iter="$rpm_iteration"
            else
              ver="$VERSION"; iter="1"
            fi
            # No --depends yet. The AUR package declares gtk3, libxt,
            # dbus-glib, nss, libpulse and friends, but those libraries are
            # named differently on Debian and Fedora and were renamed again in
            # Debian's time_t transition (libgtk-3-0 to libgtk-3-0t64), so
            # naming them wrong makes the package refuse to install, which is
            # worse than omitting them. Install the first real build on each
            # target and declare what it actually turns out to be missing.
            fpm -s dir -t "$target" \
              -n zen-browser-tst \
              -v "$ver" \
              --iteration "$iter" \
              --description "Zen Browser with native tree-style tabs (unofficial fork)" \
              --url "https://github.com/joegoldin/zen-browser-desktop" \
              --license MPL-2.0 \
              --conflicts zen-browser \
              --provides zen-browser \
              -C root .
          done

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "$VERSION" ./*.deb ./*.rpm
