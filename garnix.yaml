# The self-hosted garnix instance builds this flake and uploads the closure to
# its binary cache, so every machine in the fleet downloads Zen instead of
# spending hours compiling it. That cache is the entire reason this repo is on
# garnix; conventional artifacts (tarball, deb, rpm, macOS, Windows) come from
# GitHub Actions instead, because a Nix build hard-codes /nix/store paths into
# the ELF interpreter and RPATH and will not run on a machine without a Nix
# store.
#
# x86_64 only, deliberately. The only registered aarch64 builder is a two-core
# box running maxJobs = 1 that is shared with game servers, so a Firefox build
# dispatched there would grind for days. The flake still declares
# aarch64-linux so that platform can build locally; CI stays away from it.
builds:
  include:
    - "packages.x86_64-linux.zen-browser-unwrapped"

# `npm run lint` (mach lint zen) runs here rather than on GitHub, on the same
# instance that already builds the browser. This backend's action schema has
# only an "on: push" trigger and no branch filter, so every push to every
# branch is linted.
#
# Nothing is cached between runs: a garnix action gets a fresh environment, so
# each push re-downloads the Firefox source tarball (~767 MiB) and re-imports
# the patchset. The build path avoids this by going through a fetchurl FOD that
# nix caches; routing lint's download the same way would too.
#
# No githubToken, because nothing in the chain needs one. The Firefox source
# comes from archive.mozilla.org, surfer's patch import is entirely local, and
# mach's clang-format toolchain comes from Mozilla's tooltool. The single
# GitHub fetch is one transitive npm dependency of @zen-browser/surfer
# (is-apple-silicon), one anonymous request per run, far below the rate limit
# that flag exists to lift.
actions:
  - "on": push
    run: lint
    withRepoContents: true
